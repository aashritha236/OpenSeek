<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Contributions · OpenSeek</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f6f8fa;

            color: #24292f;

        }


        /* ========================================
           NAVBAR
        ======================================== */

        .navbar {

            height: 68px;

            background: #ffffff;

            border-bottom:
                1px solid #d8dee4;

            display: flex;

            align-items: center;

            padding: 0 38px;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: #24292f;

            text-decoration: none;

            font-size: 27px;

            font-weight: 700;

            margin-right: 45px;

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 28px;

            height: 100%;

        }


        .nav-links a {

            height: 100%;

            display: flex;

            align-items: center;

            position: relative;

            color: #57606a;

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;

        }


        .nav-links a:hover {

            color: #24292f;

        }


        .nav-links a.active {

            color: #24292f;

            font-weight: 600;

        }


        .nav-links a.active::after {

            content: "";

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            height: 2px;

            background: #fd8c73;

        }


        .user-area {

            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .user-avatar {

            width: 34px;

            height: 34px;

            border-radius: 50%;

            border: 1px solid #d0d7de;

        }


        .username {

            font-size: 14px;

            font-weight: 600;

        }


        .arrow {

            font-size: 11px;

            color: #57606a;

        }


        /* ========================================
           MAIN
        ======================================== */

        .container {

            max-width: 1300px;

            margin: 0 auto;

            padding: 45px 40px 70px;

        }


        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 30px;

            margin-bottom: 35px;

        }


        .page-header h1 {

            font-size: 32px;

            line-height: 1.2;

            margin-bottom: 8px;

        }


        .page-header p {

            color: #57606a;

            font-size: 15px;

            line-height: 1.5;

        }


        .sync-button {

            background: #24292f;

            color: white;

            border: none;

            border-radius: 7px;

            padding: 11px 18px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

        }


        .sync-button:hover {

            background: #000000;

        }


        .sync-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ========================================
           STATUS
        ======================================== */

        .status-message {

            display: none;

            margin-bottom: 20px;

            padding: 13px 16px;

            border-radius: 7px;

            font-size: 14px;

        }


        .status-message.error {

            display: block;

            background: #ffebe9;

            border: 1px solid #ff8182;

            color: #cf222e;

        }


        /* ========================================
           CONTRIBUTION LIST
        ======================================== */

        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;

        }


        .section-header h2 {

            font-size: 21px;

        }


        .contribution-count {

            color: #57606a;

            font-size: 13px;

        }


        .contribution-card {

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 9px;

            padding: 24px;

            margin-bottom: 16px;

        }


        .card-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

        }


        .card-title {

            color: #0969da;

            text-decoration: none;

            font-size: 18px;

            font-weight: 600;

            line-height: 1.4;

        }


        .card-title:hover {

            text-decoration: underline;

        }


        .repository {

            color: #57606a;

            font-size: 13px;

            margin-top: 7px;

        }


        /* ========================================
           STATUS BADGE
        ======================================== */

        .status-badge {

            padding: 5px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;

        }


        .status-merged {

            color: #1a7f37;

            background: #dafbe1;

        }


        .status-open {

            color: #0969da;

            background: #ddf4ff;

        }


        .status-closed {

            color: #cf222e;

            background: #ffebe9;

        }


        /* ========================================
           DESCRIPTION
        ======================================== */

        .description {

            margin-top: 17px;

            color: #57606a;

            font-size: 14px;

            line-height: 1.6;

        }


        /* ========================================
           LABELS
        ======================================== */

        .labels {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 15px;

        }


        .label {

            background: #ddf4ff;

            color: #0969da;

            border-radius: 20px;

            padding: 4px 9px;

            font-size: 11px;

            font-weight: 600;

        }


        /* ========================================
           METADATA
        ======================================== */

        .metadata {

            display: flex;

            flex-wrap: wrap;

            gap: 18px;

            margin-top: 19px;

            padding-top: 15px;

            border-top: 1px solid #d8dee4;

            color: #57606a;

            font-size: 12px;

        }


        /* ========================================
           CARD ACTIONS
        ======================================== */

        .card-actions {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 20px;

        }


        .github-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 8px 14px;

            border: 1px solid #d0d7de;

            background: #ffffff;

            color: #24292f;

            border-radius: 6px;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

        }


        .github-button:hover {

            background: #f6f8fa;

        }


        .report-button {

            padding: 8px 14px;

            border: 1px solid #24292f;

            background: #24292f;

            color: #ffffff;

            border-radius: 6px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

        }


        .report-button:hover {

            background: #000000;

        }


        .report-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ========================================
           EMPTY STATE
        ======================================== */

        .empty-state {

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 9px;

            padding: 70px 30px;

            text-align: center;

        }


        .empty-icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f6f8fa;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

        }


        .empty-state h3 {

            font-size: 20px;

            margin-bottom: 9px;

        }


        .empty-state p {

            max-width: 550px;

            margin: 0 auto;

            color: #57606a;

            font-size: 14px;

            line-height: 1.6;

        }


        .find-button {

            display: inline-block;

            margin-top: 22px;

            padding: 10px 17px;

            border-radius: 7px;

            background: #24292f;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        /* ========================================
           REPORT MODAL
        ======================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background: rgba(27, 31, 36, 0.55);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            z-index: 1000;

        }


        .modal-overlay.show {

            display: flex;

        }


        .report-modal {

            width: min(850px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 10px;

            border: 1px solid #d8dee4;

            box-shadow:
                0 20px 50px
                rgba(27, 31, 36, 0.25);

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            padding: 24px;

            border-bottom: 1px solid #d8dee4;

        }


        .modal-header h2 {

            font-size: 21px;

            line-height: 1.4;

        }


        .close-button {

            border: none;

            background: transparent;

            font-size: 25px;

            color: #57606a;

            cursor: pointer;

            line-height: 1;

        }


        .close-button:hover {

            color: #24292f;

        }


        .report-content {

            padding: 25px;

        }


        .report-title {

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .report-repository {

            color: #57606a;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .report-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 13px;

            margin-bottom: 25px;

        }


        .report-stat {

            background: #f6f8fa;

            border: 1px solid #d8dee4;

            border-radius: 7px;

            padding: 16px;

        }


        .report-stat-label {

            color: #57606a;

            font-size: 12px;

            margin-bottom: 6px;

        }


        .report-stat-value {

            font-size: 21px;

            font-weight: 700;

        }


        .report-section {

            border-top: 1px solid #d8dee4;

            padding-top: 20px;

            margin-top: 20px;

        }


        .report-section h3 {

            font-size: 15px;

            margin-bottom: 9px;

        }


        .report-section p {

            color: #57606a;

            font-size: 14px;

            line-height: 1.7;

        }


        .report-labels {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

        }


        .report-label {

            background: #ddf4ff;

            color: #0969da;

            border-radius: 20px;

            padding: 5px 10px;

            font-size: 12px;

        }


        .report-github {

            display: inline-block;

            margin-top: 22px;

            padding: 9px 15px;

            background: #24292f;

            color: white;

            border-radius: 7px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 950px) {

            .nav-links {

                gap: 16px;

            }

            .navbar {

                padding: 0 20px;

            }

            .logo {

                margin-right: 25px;

            }

            .container {

                padding:
                    35px 25px 60px;

            }

        }


        @media (max-width: 750px) {

            .navbar {

                height: auto;

                padding: 15px 20px;

                flex-wrap: wrap;

                gap: 15px;

            }

            .nav-links {

                order: 3;

                width: 100%;

                height: 42px;

                overflow-x: auto;

            }

            .page-header {

                flex-direction: column;

            }

            .sync-button {

                width: 100%;

            }

            .report-grid {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 500px) {

            .container {

                padding:
                    25px 15px 50px;

            }

            .page-header h1 {

                font-size: 27px;

            }

            .card-top {

                flex-direction: column;

            }

            .card-actions {

                flex-direction: column;

                align-items: stretch;

            }

            .github-button,
            .report-button {

                text-align: center;

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVIGATION
========================================== -->

<nav class="navbar">


    <a
        href="/dashboard.html"
        class="logo"
    >
        OpenSeek
    </a>


    <div class="nav-links">

        <a
            href="/dashboard.html"
        >
            Dashboard
        </a>


        <a
            href="/contributions.html"
            class="active"
        >
            My Contributions
        </a>


        <a
            href="/newcontribution.html"
        >
            New Contribution
        </a>


        <a
            href="/repositories.html"
        >
            Repositories
        </a>


        <a
            href="/profile.html"
        >
            Profile
        </a>

    </div>


    <div class="user-area">

        <img
            id="userAvatar"
            class="user-avatar"
            src=""
            alt="User"
        >


        <span
            id="username"
            class="username"
        >
            User
        </span>


        <span class="arrow">
            ▼
        </span>

    </div>


</nav>



<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <div class="page-header">

        <div>

            <h1>
                My Contributions
            </h1>

            <p>
                Your open-source contribution history from GitHub.
            </p>

        </div>


        <button
            id="syncButton"
            class="sync-button"
        >
            Sync GitHub Activity
        </button>

    </div>



    <div
        id="errorMessage"
        class="status-message"
    ></div>



    <!-- ======================================
         CONTRIBUTIONS
    ======================================= -->

    <section>


        <div class="section-header">

            <h2>
                Contribution History
            </h2>


            <span
                id="contributionCount"
                class="contribution-count"
            >
                0 contributions
            </span>

        </div>



        <div
            id="contributionList"
        ></div>


    </section>


</main>



<!-- ==========================================
     REPORT MODAL
========================================== -->

<div
    id="reportOverlay"
    class="modal-overlay"
>


    <div class="report-modal">


        <div class="modal-header">

            <h2>
                Contribution Report
            </h2>


            <button
                id="closeReport"
                class="close-button"
            >
                ×
            </button>

        </div>


        <div
            id="reportContent"
            class="report-content"
        >

        </div>


    </div>

</div>



<script>


    /* ========================================
       ELEMENTS
    ======================================== */

    const userAvatar =
        document.getElementById(
            "userAvatar"
        );


    const usernameElement =
        document.getElementById(
            "username"
        );


    const contributionList =
        document.getElementById(
            "contributionList"
        );


    const contributionCount =
        document.getElementById(
            "contributionCount"
        );


    const syncButton =
        document.getElementById(
            "syncButton"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const reportOverlay =
        document.getElementById(
            "reportOverlay"
        );


    const reportContent =
        document.getElementById(
            "reportContent"
        );


    const closeReport =
        document.getElementById(
            "closeReport"
        );



    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    /* ========================================
       DATE FORMAT
    ======================================== */

    function formatDate(date) {

        if (!date) {

            return "Not available";

        }


        const parsed =
            new Date(date);


        if (
            Number.isNaN(
                parsed.getTime()
            )
        ) {

            return "Not available";

        }


        return parsed.toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }



    /* ========================================
       ERROR
    ======================================== */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.className =
            "status-message error";

    }



    function clearError() {

        errorMessage.textContent = "";

        errorMessage.className =
            "status-message";

    }



    /* ========================================
       LOAD USER
    ======================================== */

    async function loadUser() {

        const response =
            await fetch(
                "/api/me"
            );


        if (
            !response.ok
        ) {

            window.location.href =
                "/";

            return null;

        }


        const user =
            await response.json();


        usernameElement.textContent =
            user.username ||
            "User";


        userAvatar.src =
            user.avatarUrl ||
            "";


        return user;

    }



    /* ========================================
       STATUS
    ======================================== */

    function statusClass(status) {

        if (
            status === "merged"
        ) {

            return "status-merged";

        }


        if (
            status === "closed"
        ) {

            return "status-closed";

        }


        return "status-open";

    }



    function statusText(status) {

        if (
            status === "merged"
        ) {

            return "Merged";

        }


        if (
            status === "closed"
        ) {

            return "Closed";

        }


        return "Open";

    }



    /* ========================================
       EMPTY STATE
    ======================================== */

    function showEmptyState() {

        contributionList.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    ◇
                </div>


                <h3>
                    You haven't contributed yet
                </h3>


                <p>
                    Your GitHub contributions will appear
                    here once you make your first pull
                    request to an open-source project.
                </p>


                <a
                    href="/newcontribution.html"
                    class="find-button"
                >
                    Find a Contribution
                </a>

            </div>

        `;

    }



    /* ========================================
       RENDER CONTRIBUTIONS
    ======================================== */

    function renderContributions(
        contributions
    ) {

        contributionCount.textContent =
            `${contributions.length} contribution${
                contributions.length === 1
                    ? ""
                    : "s"
            }`;


        if (
            !contributions ||
            contributions.length === 0
        ) {

            showEmptyState();

            return;

        }


        contributionList.innerHTML =
            contributions
                .map(
                    contribution => {

                        const labels =
                            Array.isArray(
                                contribution.labels
                            )
                                ? contribution.labels
                                : [];


                        return `

                            <article
                                class="contribution-card"
                            >


                                <div
                                    class="card-top"
                                >

                                    <div>

                                        <a
                                            href="${escapeHtml(
                                                contribution.pullRequestUrl
                                            )}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            class="card-title"
                                        >
                                            ${escapeHtml(
                                                contribution.title
                                            )}
                                        </a>


                                        <div
                                            class="repository"
                                        >
                                            ${escapeHtml(
                                                contribution.repository
                                            )}

                                            ·

                                            PR #${escapeHtml(
                                                contribution.pullRequestNumber
                                            )}
                                        </div>

                                    </div>


                                    <span
                                        class="status-badge ${statusClass(
                                            contribution.status
                                        )}"
                                    >
                                        ${statusText(
                                            contribution.status
                                        )}
                                    </span>

                                </div>



                                ${
                                    contribution.description
                                        ? `

                                            <div
                                                class="description"
                                            >

                                                ${escapeHtml(
                                                    contribution.description
                                                )}

                                            </div>

                                        `
                                        : ""
                                }



                                ${
                                    labels.length
                                        ? `

                                            <div
                                                class="labels"
                                            >

                                                ${labels
                                                    .map(
                                                        label =>
                                                            `

                                                                <span
                                                                    class="label"
                                                                >
                                                                    ${escapeHtml(
                                                                        label
                                                                    )}
                                                                </span>

                                                            `
                                                    )
                                                    .join("")
                                                }

                                            </div>

                                        `
                                        : ""
                                }



                                <div
                                    class="metadata"
                                >

                                    <span>

                                        Created:
                                        ${formatDate(
                                            contribution.githubCreatedAt
                                        )}

                                    </span>


                                    ${
                                        contribution.githubMergedAt
                                            ? `

                                                <span>

                                                    Merged:
                                                    ${formatDate(
                                                        contribution.githubMergedAt
                                                    )}

                                                </span>

                                            `
                                            : ""
                                    }


                                    <span>

                                        +${Number(
                                            contribution.additions || 0
                                        )}
                                        additions

                                    </span>


                                    <span>

                                        -${Number(
                                            contribution.deletions || 0
                                        )}
                                        deletions

                                    </span>


                                    <span>

                                        ${Number(
                                            contribution.changedFiles || 0
                                        )}
                                        files changed

                                    </span>

                                </div>



                                <div
                                    class="card-actions"
                                >

                                    <a
                                        href="${escapeHtml(
                                            contribution.pullRequestUrl
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="github-button"
                                    >
                                        View on GitHub
                                    </a>


                                    <button
                                        class="report-button"
                                        data-id="${escapeHtml(
                                            contribution._id
                                        )}"
                                    >
                                        Generate Report
                                    </button>

                                </div>


                            </article>

                        `;

                    }
                )
                .join("");


        /*
        Attach report buttons
        */

        document
            .querySelectorAll(
                ".report-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            generateReport(
                                button.dataset.id,
                                button
                            );

                        }
                    );

                }
            );

    }



    /* ========================================
       SYNC CONTRIBUTIONS
    ======================================== */

    async function syncContributions() {

        clearError();


        syncButton.disabled =
            true;


        syncButton.textContent =
            "Syncing...";


        try {

            const response =
                await fetch(
                    "/api/contributions/sync",
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.message ||
                    "Could not synchronize GitHub activity."
                );

            }


            renderContributions(
                data.contributions || []
            );


        } catch (error) {

            console.error(
                "Contribution sync error:",
                error
            );


            showError(
                error.message ||
                "Could not load your GitHub contributions."
            );


            /*
            Even if synchronization fails,
            try loading existing MongoDB history.
            */

            await loadStoredContributions();

        } finally {

            syncButton.disabled =
                false;

            syncButton.textContent =
                "Sync GitHub Activity";

        }

    }



    /* ========================================
       LOAD STORED CONTRIBUTIONS
    ======================================== */

    async function loadStoredContributions() {

        try {

            const response =
                await fetch(
                    "/api/contributions/"
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.message ||
                    "Could not load contribution history."
                );

            }


            renderContributions(
                data.contributions || []
            );


        } catch (error) {

            console.error(
                "History loading error:",
                error
            );


            showError(
                error.message ||
                "Could not load contribution history."
            );

        }

    }



    /* ========================================
       GENERATE REPORT
    ======================================== */

    async function generateReport(
        contributionId,
        button
    ) {

        clearError();


        button.disabled =
            true;


        button.textContent =
            "Generating...";


        try {

            const response =
                await fetch(
                    `/api/contributions/report/${encodeURIComponent(
                        contributionId
                    )}`
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.message ||
                    "Could not generate contribution report."
                );

            }


            displayReport(
                data.report
            );


        } catch (error) {

            console.error(
                "Report generation error:",
                error
            );


            showError(
                error.message ||
                "Could not generate contribution report."
            );

        } finally {

            button.disabled =
                false;

            button.textContent =
                "Generate Report";

        }

    }



    /* ========================================
       DISPLAY REPORT
    ======================================== */

    function displayReport(report) {

        const contribution =
            report.contribution;


        const changes =
            report.changes;


        const analysis =
            report.analysis;


        const timeline =
            report.timeline;


        const labels =
            analysis.labels || [];


        reportContent.innerHTML = `

            <div
                class="report-title"
            >
                ${escapeHtml(
                    contribution.title
                )}
            </div>


            <div
                class="report-repository"
            >

                ${escapeHtml(
                    contribution.repository
                )}

                · PR #

                ${escapeHtml(
                    contribution.pullRequestNumber
                )}

            </div>



            <div
                class="report-grid"
            >

                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Status
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        ${escapeHtml(
                            contribution.status
                        )}
                    </div>

                </div>


                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Additions
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        +${changes.additions}
                    </div>

                </div>


                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Deletions
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        -${changes.deletions}
                    </div>

                </div>


                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Files Changed
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        ${changes.changedFiles}
                    </div>

                </div>


                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Contribution Type
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        ${escapeHtml(
                            analysis.contributionType
                        )}
                    </div>

                </div>


                <div
                    class="report-stat"
                >

                    <div
                        class="report-stat-label"
                    >
                        Scope
                    </div>

                    <div
                        class="report-stat-value"
                    >
                        ${escapeHtml(
                            analysis.contributionSize
                        )}
                    </div>

                </div>

            </div>



            ${
                contribution.description
                    ? `

                        <div
                            class="report-section"
                        >

                            <h3>
                                Contribution Description
                            </h3>

                            <p>
                                ${escapeHtml(
                                    contribution.description
                                )}
                            </p>

                        </div>

                    `
                    : ""
            }



            <div
                class="report-section"
            >

                <h3>
                    Timeline
                </h3>

                <p>

                    Created:
                    ${formatDate(
                        timeline.createdAt
                    )}

                    <br>

                    Updated:
                    ${formatDate(
                        timeline.updatedAt
                    )}

                    ${
                        timeline.mergedAt
                            ? `

                                <br>

                                Merged:
                                ${formatDate(
                                    timeline.mergedAt
                                )}

                            `
                            : ""
                    }

                </p>

            </div>



            ${
                labels.length
                    ? `

                        <div
                            class="report-section"
                        >

                            <h3>
                                Labels
                            </h3>


                            <div
                                class="report-labels"
                            >

                                ${labels
                                    .map(
                                        label =>
                                            `

                                                <span
                                                    class="report-label"
                                                >
                                                    ${escapeHtml(
                                                        label
                                                    )}
                                                </span>

                                            `
                                    )
                                    .join("")
                                }

                            </div>

                        </div>

                    `
                    : ""
            }



            <div
                class="report-section"
            >

                <h3>
                    Contribution Summary
                </h3>

                <p>

                    This contribution is classified as a
                    <strong>
                        ${escapeHtml(
                            analysis.contributionType
                        )}
                    </strong>
                    with a
                    <strong>
                        ${escapeHtml(
                            analysis.contributionSize
                        )}
                    </strong>
                    scope.

                    The pull request changed
                    <strong>
                        ${changes.changedFiles}
                    </strong>
                    files with
                    <strong>
                        ${changes.additions}
                    </strong>
                    additions and
                    <strong>
                        ${changes.deletions}
                    </strong>
                    deletions.

                </p>

            </div>



            <a
                href="${escapeHtml(
                    contribution.pullRequestUrl
                )}"
                target="_blank"
                rel="noopener noreferrer"
                class="report-github"
            >
                View Pull Request on GitHub
            </a>

        `;


        reportOverlay.classList.add(
            "show"
        );

    }



    /* ========================================
       CLOSE MODAL
    ======================================== */

    closeReport.addEventListener(
        "click",
        () => {

            reportOverlay.classList.remove(
                "show"
            );

        }
    );


    reportOverlay.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                reportOverlay
            ) {

                reportOverlay.classList.remove(
                    "show"
                );

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                reportOverlay.classList.remove(
                    "show"
                );

            }

        }
    );



    /* ========================================
       SYNC BUTTON
    ======================================== */

    syncButton.addEventListener(
        "click",
        syncContributions
    );



    /* ========================================
       INITIALIZE
    ======================================== */

    async function initialize() {

        try {

            await loadUser();

            /*
            Automatically synchronize GitHub
            activity when page opens.
            */

            await syncContributions();

        } catch (error) {

            console.error(
                "Page initialization failed:",
                error
            );

            showError(
                "Could not initialize My Contributions."
            );

        }

    }


    initialize();

</script>


</body>

</html>
