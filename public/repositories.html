<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Repositories · OpenSeek</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            background: #f6f8fa;

            color: #1f2328;

            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 68px;

            background: #ffffff;

            border-bottom:
                1px solid #d0d7de;

            display: flex;

            align-items: center;

            padding:
                0 32px;

            gap: 32px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {
            font-size: 26px;

            font-weight: 700;

            color: #24292f;

            text-decoration: none;

            letter-spacing: -0.5px;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 26px;

            flex: 1;
        }


        .nav-links a {
            text-decoration: none;

            color: #57606a;

            font-size: 14px;

            font-weight: 500;

            height: 68px;

            display: flex;

            align-items: center;

            position: relative;
        }


        .nav-links a:hover {
            color: #24292f;
        }


        .nav-links a.active {
            color: #24292f;

            font-weight: 600;
        }


        .nav-links a.active::after {
            content: "";

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            height: 2px;

            background: #fd8c73;
        }


        .user-area {
            display: flex;

            align-items: center;

            gap: 9px;

            color: #24292f;

            font-size: 14px;

            font-weight: 500;
        }


        .user-avatar {
            width: 34px;

            height: 34px;

            border-radius: 50%;

            object-fit: cover;

            border:
                1px solid #d0d7de;

            background: #f6f8fa;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1450px;

            margin: 0 auto;

            padding:
                38px 40px 60px;
        }


        .page-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 28px;
        }


        .page-title {
            font-size: 32px;

            font-weight: 650;

            letter-spacing: -0.7px;

            margin-bottom: 7px;
        }


        .page-subtitle {
            color: #656d76;

            font-size: 15px;
        }


        .sync-button {
            border: 1px solid #d0d7de;

            background: #ffffff;

            color: #24292f;

            border-radius: 7px;

            padding:
                9px 15px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .sync-button:hover {
            background: #f6f8fa;
        }


        .sync-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 24px;
        }


        .search-wrapper {
            flex: 1;

            max-width: 600px;

            position: relative;
        }


        .search-input {
            width: 100%;

            height: 42px;

            border:
                1px solid #d0d7de;

            border-radius: 7px;

            background: #ffffff;

            padding:
                0 14px;

            font-size: 14px;

            color: #24292f;

            outline: none;
        }


        .search-input:focus {
            border-color: #0969da;

            box-shadow:
                0 0 0 3px
                rgba(9, 105, 218, 0.12);
        }


        .repository-count {
            color: #656d76;

            font-size: 14px;

            white-space: nowrap;
        }


        /* =========================
           STATUS
        ========================= */

        .status-message {
            display: none;

            background: #ffffff;

            border:
                1px solid #d0d7de;

            border-radius: 8px;

            padding: 25px;

            text-align: center;

            color: #656d76;

            margin-bottom: 24px;
        }


        .status-message.error {
            display: block;

            color: #cf222e;

            border-color: #ff818266;

            background: #fff8f8;
        }


        .status-message.loading {
            display: block;
        }


        /* =========================
           REPOSITORY GRID
        ========================= */

        .repository-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        .repository-card {
            background: #ffffff;

            border:
                1px solid #d0d7de;

            border-radius: 10px;

            padding: 24px;

            display: flex;

            flex-direction: column;

            min-height: 285px;

            transition:
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }


        .repository-card:hover {
            border-color: #afb8c1;

            box-shadow:
                0 3px 10px
                rgba(31, 35, 40, 0.08);
        }


        .repository-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 12px;
        }


        .repository-name {
            font-size: 19px;

            font-weight: 650;

            color: #0969da;

            word-break: break-word;
        }


        .visibility {
            border:
                1px solid #d0d7de;

            border-radius: 20px;

            padding:
                3px 9px;

            font-size: 12px;

            color: #656d76;

            white-space: nowrap;
        }


        .repository-description {
            color: #656d76;

            font-size: 14px;

            line-height: 1.55;

            min-height: 44px;

            margin-bottom: 20px;
        }


        .repository-description.empty {
            font-style: italic;

            color: #8c959f;
        }


        /* =========================
           STATS
        ========================= */

        .repository-stats {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 16px;

            margin-bottom: 18px;

            color: #656d76;

            font-size: 13px;
        }


        .stat {
            display: flex;

            align-items: center;

            gap: 5px;
        }


        .language {
            display: flex;

            align-items: center;

            gap: 6px;
        }


        .language-dot {
            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #8250df;
        }


        /* =========================
           TOPICS
        ========================= */

        .topics {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            min-height: 28px;

            margin-bottom: 18px;
        }


        .topic {
            background: #ddf4ff;

            color: #0969da;

            border-radius: 20px;

            padding:
                4px 9px;

            font-size: 12px;

            font-weight: 500;
        }


        /* =========================
           FOOTER
        ========================= */

        .repository-footer {
            margin-top: auto;

            padding-top: 17px;

            border-top:
                1px solid #d8dee4;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .updated {
            color: #656d76;

            font-size: 12px;
        }


        .github-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            background: #24292f;

            color: #ffffff;

            border-radius: 7px;

            padding:
                8px 13px;

            font-size: 13px;

            font-weight: 600;

            white-space: nowrap;
        }


        .github-button:hover {
            background: #32383f;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            display: none;

            background: #ffffff;

            border:
                1px solid #d0d7de;

            border-radius: 10px;

            padding: 60px 30px;

            text-align: center;
        }


        .empty-state h2 {
            font-size: 20px;

            margin-bottom: 8px;
        }


        .empty-state p {
            color: #656d76;

            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .repository-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                gap: 14px;
            }

            .navbar {
                padding: 0 20px;

                gap: 20px;
            }

            .container {
                padding:
                    30px 22px 50px;
            }

        }


        @media (max-width: 700px) {

            .navbar {
                height: auto;

                min-height: 68px;

                flex-wrap: wrap;

                padding:
                    12px 18px;
            }


            .nav-links {
                order: 3;

                width: 100%;

                overflow-x: auto;
            }


            .nav-links a {
                height: 40px;

                white-space: nowrap;
            }


            .nav-links a.active::after {
                bottom: 0;
            }


            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }


            .toolbar {
                align-items: stretch;

                flex-direction: column;
            }


            .search-wrapper {
                max-width: none;
            }


            .repository-footer {
                align-items: flex-start;

                flex-direction: column;
            }


            .github-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <a
            href="/dashboard.html"
            class="logo"
        >
            OpenSeek
        </a>


        <div class="nav-links">

            <a href="/dashboard.html">
                Dashboard
            </a>

            <a href="/contributions.html">
                My Contributions
            </a>

            <a href="/newcontribution.html">
                New Contribution
            </a>

            <a
                href="/repositories.html"
                class="active"
            >
                Repositories
            </a>

            <a href="/profile.html">
                Profile
            </a>

        </div>


        <div class="user-area">

            <img
                id="userAvatar"
                class="user-avatar"
                src=""
                alt="User"
            >

            <span id="username">
                Developer
            </span>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Repositories
                </h1>

                <p class="page-subtitle">
                    Your GitHub repositories
                </p>

            </div>


            <button
                id="syncButton"
                class="sync-button"
            >
                ↻ Sync GitHub
            </button>

        </div>



        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="search-wrapper">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search repositories..."
                    autocomplete="off"
                >

            </div>


            <div
                id="repositoryCount"
                class="repository-count"
            >
                0 repositories
            </div>

        </div>



        <!-- STATUS -->

        <div
            id="statusMessage"
            class="status-message"
        ></div>



        <!-- REPOSITORY GRID -->

        <div
            id="repositoryGrid"
            class="repository-grid"
        ></div>



        <!-- EMPTY STATE -->

        <div
            id="emptyState"
            class="empty-state"
        >

            <h2>
                No repositories found
            </h2>

            <p>
                Your GitHub account does not have
                any repositories matching this search.
            </p>

        </div>


    </main>



    <script>

        let repositories = [];


        /* =========================
           ELEMENTS
        ========================== */

        const repositoryGrid =
            document.getElementById(
                "repositoryGrid"
            );

        const repositoryCount =
            document.getElementById(
                "repositoryCount"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const syncButton =
            document.getElementById(
                "syncButton"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const statusMessage =
            document.getElementById(
                "statusMessage"
            );

        const usernameElement =
            document.getElementById(
                "username"
            );

        const userAvatar =
            document.getElementById(
                "userAvatar"
            );



        /* =========================
           ESCAPE HTML
        ========================== */

        function escapeHtml(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }



        /* =========================
           DATE FORMAT
        ========================== */

        function formatDate(dateString) {

            if (!dateString) {
                return "Unknown";
            }

            const date =
                new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "Unknown";
            }

            return date.toLocaleDateString(
                undefined,
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                }
            );
        }



        /* =========================
           LOAD USER
        ========================== */

        async function loadUser() {

            try {

                const response =
                    await fetch("/api/me");

                if (!response.ok) {

                    window.location.href = "/";

                    return;
                }


                const user =
                    await response.json();


                usernameElement.textContent =
                    user.username ||
                    "Developer";


                if (user.avatarUrl) {

                    userAvatar.src =
                        user.avatarUrl;

                } else {

                    userAvatar.style.display =
                        "none";
                }

            } catch (error) {

                console.error(
                    "Could not load user:",
                    error
                );

            }

        }



        /* =========================
           LOAD REPOSITORIES
        ========================== */

        async function loadRepositories() {

            showLoading();


            try {

                const response =
                    await fetch(
                        "/api/repositories"
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href = "/";

                    return;
                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load repositories"
                    );

                }


                repositories =
                    Array.isArray(
                        data.repositories
                    )
                        ? data.repositories
                        : [];


                renderRepositories(
                    repositories
                );


            } catch (error) {

                console.error(
                    "Repository loading error:",
                    error
                );


                showError(
                    "Could not load repositories. Please try again."
                );

            }

        }



        /* =========================
           RENDER REPOSITORIES
        ========================== */

        function renderRepositories(
            list
        ) {

            repositoryGrid.innerHTML =
                "";

            hideStatus();


            repositoryCount.textContent =
                `${list.length} ${
                    list.length === 1
                        ? "repository"
                        : "repositories"
                }`;


            if (list.length === 0) {

                emptyState.style.display =
                    "block";

                return;
            }


            emptyState.style.display =
                "none";


            list.forEach(repo => {

                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "repository-card";


                const visibility =
                    repo.private
                        ? "Private"
                        : "Public";


                const description =
                    repo.description
                        ? escapeHtml(
                            repo.description
                        )
                        : "No description provided.";


                const descriptionClass =
                    repo.description
                        ? "repository-description"
                        : "repository-description empty";


                const topics =
                    Array.isArray(
                        repo.topics
                    )
                        ? repo.topics
                        : [];


                const topicHtml =
                    topics
                        .slice(0, 6)
                        .map(topic =>
                            `<span class="topic">
                                ${escapeHtml(topic)}
                            </span>`
                        )
                        .join("");


                card.innerHTML = `

                    <div class="repository-top">

                        <div class="repository-name">
                            ${escapeHtml(repo.name)}
                        </div>

                        <span class="visibility">
                            ${visibility}
                        </span>

                    </div>


                    <p class="${descriptionClass}">
                        ${description}
                    </p>


                    <div class="repository-stats">

                        <span class="language">
                            <span class="language-dot"></span>
                            ${escapeHtml(repo.language)}
                        </span>


                        <span class="stat">
                            ⭐ ${repo.stars}
                        </span>


                        <span class="stat">
                            🍴 ${repo.forks}
                        </span>


                        <span class="stat">
                            Issues ${repo.openIssues}
                        </span>

                    </div>


                    <div class="topics">

                        ${topicHtml}

                    </div>


                    <div class="repository-footer">

                        <span class="updated">
                            Updated ${formatDate(repo.updatedAt)}
                        </span>


                        <a
                            class="github-button"
                            href="${escapeHtml(repo.htmlUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Open on GitHub ↗
                        </a>

                    </div>

                `;


                repositoryGrid.appendChild(
                    card
                );

            });

        }



        /* =========================
           SEARCH
        ========================== */

        function filterRepositories() {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                renderRepositories(
                    repositories
                );

                return;
            }


            const filtered =
                repositories.filter(
                    repo => {

                        const name =
                            repo.name ||
                            "";

                        const description =
                            repo.description ||
                            "";

                        const language =
                            repo.language ||
                            "";

                        const topics =
                            Array.isArray(
                                repo.topics
                            )
                                ? repo.topics.join(" ")
                                : "";


                        const searchableText =
                            `${name} ${description} ${language} ${topics}`
                                .toLowerCase();


                        return searchableText
                            .includes(query);

                    }
                );


            renderRepositories(
                filtered
            );

        }



        /* =========================
           SYNC BUTTON
        ========================== */

        async function syncRepositories() {

            syncButton.disabled =
                true;

            syncButton.textContent =
                "↻ Loading...";


            await loadRepositories();


            syncButton.disabled =
                false;

            syncButton.textContent =
                "↻ Sync GitHub";

        }



        /* =========================
           STATUS HELPERS
        ========================== */

        function showLoading() {

            statusMessage.className =
                "status-message loading";

            statusMessage.textContent =
                "Loading your GitHub repositories...";

            repositoryGrid.innerHTML =
                "";

            emptyState.style.display =
                "none";

        }


        function showError(message) {

            statusMessage.className =
                "status-message error";

            statusMessage.textContent =
                message;

            repositoryGrid.innerHTML =
                "";

            emptyState.style.display =
                "none";

            repositoryCount.textContent =
                "Unable to load";

        }


        function hideStatus() {

            statusMessage.className =
                "status-message";

            statusMessage.textContent =
                "";

        }



        /* =========================
           EVENTS
        ========================== */

        searchInput.addEventListener(
            "input",
            filterRepositories
        );


        syncButton.addEventListener(
            "click",
            syncRepositories
        );



        /* =========================
           INITIAL LOAD
        ========================== */

        async function initializePage() {

            await loadUser();

            await loadRepositories();

        }


        initializePage();

    </script>

</body>

</html>
